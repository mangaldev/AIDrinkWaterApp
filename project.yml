# FULL build (paid Apple Developer account): blocks other apps with Screen Time.
# Generate with:  brew install xcodegen && xcodegen
# No paid account? Use project-free.yml instead (see README).
name: DrinkWater
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""   # put your Apple team ID here
    CODE_SIGN_STYLE: Automatic
    OTHER_SWIFT_FLAGS: "$(inherited) -DSCREEN_TIME"

targets:
  DrinkWater:
    type: application
    platform: iOS
    sources: [DrinkWater, Shared]
    info:
      path: DrinkWater/Info.plist
      properties:
        CFBundleDisplayName: DrinkWater
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSCameraUsageDescription: DrinkWater uses the front camera to check that you are drinking water. Video never leaves your phone.
    entitlements:
      path: DrinkWater/DrinkWater.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups: [group.com.example.drinkwater]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.drinkwater
    dependencies:
      - target: DrinkWaterMonitor
      - target: DrinkWaterShieldConfig
      - target: DrinkWaterShieldAction

  DrinkWaterMonitor:
    type: app-extension
    platform: iOS
    sources: [DrinkWaterMonitor, Shared]
    info:
      path: DrinkWaterMonitor/Info.plist
      properties:
        CFBundleDisplayName: DrinkWater Monitor
        NSExtension:
          NSExtensionPointIdentifier: com.apple.deviceactivity.monitor-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).DrinkMonitor
    entitlements:
      path: DrinkWaterMonitor/DrinkWaterMonitor.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups: [group.com.example.drinkwater]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.drinkwater.monitor

  DrinkWaterShieldConfig:
    type: app-extension
    platform: iOS
    sources: [DrinkWaterShieldConfig, Shared]
    info:
      path: DrinkWaterShieldConfig/Info.plist
      properties:
        CFBundleDisplayName: DrinkWater Shield
        NSExtension:
          NSExtensionPointIdentifier: com.apple.ManagedSettingsUI.shield-configuration-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShieldConfig
    entitlements:
      path: DrinkWaterShieldConfig/DrinkWaterShieldConfig.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups: [group.com.example.drinkwater]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.drinkwater.shieldconfig

  DrinkWaterShieldAction:
    type: app-extension
    platform: iOS
    sources: [DrinkWaterShieldAction, Shared]
    info:
      path: DrinkWaterShieldAction/Info.plist
      properties:
        CFBundleDisplayName: DrinkWater Shield Action
        NSExtension:
          NSExtensionPointIdentifier: com.apple.ManagedSettings.shield-action-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).DrinkShieldAction
    entitlements:
      path: DrinkWaterShieldAction/DrinkWaterShieldAction.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups: [group.com.example.drinkwater]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.drinkwater.shieldaction
