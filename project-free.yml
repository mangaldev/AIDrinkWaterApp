# FREE build: works with a free Apple ID, installed over a cable from a Mac.
# No Screen Time, so other apps aren't blocked; DrinkWater locks itself until you drink.
# Generate with:  brew install xcodegen && xcodegen --spec project-free.yml
name: DrinkWaterFree
options:
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""   # pick your "Personal Team" in Xcode instead of typing it here
    CODE_SIGN_STYLE: Automatic

targets:
  DrinkWater:
    type: application
    platform: iOS
    sources:
      - DrinkWater
      - Shared
    info:
      path: DrinkWater/Info.plist
      properties:
        CFBundleDisplayName: DrinkWater
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSCameraUsageDescription: DrinkWater uses the front camera to check that you are drinking water. Video never leaves your phone.
    settings:
      base:
        # Must be unique to you. Change "yourname" to anything, e.g. your name.
        PRODUCT_BUNDLE_IDENTIFIER: com.yourname.drinkwater
