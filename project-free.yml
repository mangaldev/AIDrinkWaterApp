# STANDARD build: this is also the App Store version 1 build.
# Works with a free Apple ID over a cable, or a paid account for TestFlight / App Store.
# No Screen Time, so other apps aren't blocked; the app stays on the camera check until you drink.
# Generate with:  brew install xcodegen && xcodegen --spec project-free.yml
name: DrinkWaterFree
options:
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0"        # version shown on the App Store
    CURRENT_PROJECT_VERSION: "1"    # build number: raise it for every upload
    TARGETED_DEVICE_FAMILY: "1"     # iPhone only
    DEVELOPMENT_TEAM: ""   # pick your "Personal Team" in Xcode instead of typing it here
    CODE_SIGN_STYLE: Automatic

targets:
  DrinkWater:
    type: application
    platform: iOS
    sources:
      - DrinkWater
      - Shared
    info:
      path: DrinkWater/Info.plist
      properties:
        CFBundleDisplayName: SipProof
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.healthcare-fitness
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSCameraUsageDescription: SipProof uses the front camera to check that you are drinking water. Video never leaves your phone.
    settings:
      base:
        # Must be unique to you; it can't change after the first App Store upload.
        PRODUCT_BUNDLE_IDENTIFIER: com.mangaldev.drinkwater
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
